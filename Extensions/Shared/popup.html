<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mulee</title>
    <link rel="stylesheet" href="popup.css">
    <script src="core.js" defer></script>
    <script src="video-login.js" defer></script>
    <script src="popup.js" defer></script>
</head>
<body>
    <header><img src="icons/icon-48.png" width="32" height="32" alt=""><h1>Mulee</h1></header>
    <p data-i18n="chooseLinks"></p>
    <div id="selection-actions" hidden>
        <button id="select-all" data-i18n="selectAll" type="button"></button>
        <button id="select-none" data-i18n="selectNone" type="button"></button>
    </div>
    <div id="links" role="group" aria-labelledby="link-heading"><span id="link-heading" data-i18n="pageLinks"></span></div>
    <p id="empty" data-i18n="empty" hidden></p>
    <button id="send" data-i18n="send" disabled></button>
    <p id="status" role="status" aria-live="polite"></p>
    <details>
        <summary data-i18n="videoLoginOptions"></summary>
        <label class="toggle"><input id="video-login" type="checkbox"><span data-i18n="videoLogin"></span></label>
        <p class="hint" data-i18n="videoLoginHint"></p>
        <button id="video-login-sync" data-i18n="videoLoginSync" disabled></button>
    </details>
    <details>
        <summary data-i18n="options"></summary>
        <label class="toggle"><input id="takeover" type="checkbox"><span data-i18n="takeover"></span></label>
        <p class="hint" data-i18n="takeoverHint"></p>
        <label for="extensions" data-i18n="extensions"></label>
        <textarea id="extensions" rows="3" spellcheck="false"></textarea>
        <button id="save" data-i18n="save"></button>
    </details>
    <p class="hint" data-i18n="confirmHint"></p>
</body>
</html>

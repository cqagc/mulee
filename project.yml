name: Mulee
options:
  bundleIdPrefix: com.cqagc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja]
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "7"
    ARCHS: arm64
    DEVELOPMENT_TEAM: LV69DG6R9Y
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      OTHER_SWIFT_FLAGS: '$(inherited) -file-prefix-map $(SRCROOT)=. -debug-prefix-map $(SRCROOT)=.'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  MuleeCore:
    path: Packages/MuleeCore
targets:
  Mulee:
    type: application
    platform: macOS
    sources:
      - path: Mulee
        excludes: [Resources/Licenses]
      - path: Mulee/Resources/Licenses
        type: folder
      - path: MuleeSafariExtension/BrowserExtensionRequest.swift
    entitlements:
      path: Mulee/App/VideoLogin.entitlements
      properties:
        com.apple.security.application-groups: [LV69DG6R9Y.com.cqagc.mulee.video-login]
    dependencies:
      - package: MuleeCore
      - package: Sparkle
      - target: MuleeSafariExtension
        embed: true
    info:
      path: Mulee/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mulee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.cqagc.mulee.links
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [magnet, ed2k, thunder, mulee]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent 种子文件
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent 种子文件
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
        NSServices:
          - NSMenuItem:
              default: 用 Mulee 下载
            NSMessage: downloadWithMulee
            NSPortName: Mulee
            NSSendTypes: [NSStringPboardType, NSURLPboardType, public.utf8-plain-text, public.url]
            NSRequiredContext: {}
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 CQAGC. GPL-3.0."
        SUFeedURL: https://github.com/cqagc/mulee/releases/latest/download/appcast.xml
        SUPublicEDKey: "v0O71QSNMq+qeWqiJJJw2zLqjpg9AItheGRHHwfmhj0="
        SUEnableAutomaticChecks: YES
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: NO
    postBuildScripts:
      - name: Bundle Chrome extension
        script: '"$SRCROOT"/scripts/package-extensions.sh --chrome'
        basedOnDependencyAnalysis: false
      - name: Bundle aria2
        script: '"$SRCROOT"/scripts/build-aria2.sh'
        basedOnDependencyAnalysis: false
      - name: Bundle mulee-torrentd
        script: '"$SRCROOT"/scripts/build-torrentd.sh'
        basedOnDependencyAnalysis: false
      - name: Bundle amuled
        script: '"$SRCROOT"/scripts/build-amuled.sh'
        basedOnDependencyAnalysis: false
      - name: Bundle 7-Zip
        script: '"$SRCROOT"/scripts/build-7zip.sh'
        basedOnDependencyAnalysis: false
      - name: Sign Sparkle components
        shell: /bin/bash
        script: |
          set -euo pipefail
          FRAMEWORK="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          SIGN_ARGS=(--force --sign "${IDENTITY:--}" --options runtime --preserve-metadata=entitlements)
          if [ -n "$IDENTITY" ] && [ "$IDENTITY" != - ]; then
            SIGN_ARGS+=(--timestamp)
          fi
          # SPM 的 Embed & Sign 只重签外层 Framework；里面的代码必须从内到外重签。
          while IFS= read -r -d '' item; do
            if file -b "$item" | grep -q 'Mach-O'; then
              codesign "${SIGN_ARGS[@]}" "$item"
            fi
          done < <(find "$FRAMEWORK/Versions/Current"/ -type f -perm -u+x -print0)
          while IFS= read -r -d '' item; do
            codesign "${SIGN_ARGS[@]}" "$item"
          done < <(find "$FRAMEWORK/Versions/Current"/ -depth -type d \( -name '*.xpc' -o -name '*.app' \) -print0)
          codesign "${SIGN_ARGS[@]}" "$FRAMEWORK"
          codesign --verify --deep --strict "$FRAMEWORK"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cqagc.mulee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # 引擎脚本在 build/ 缓存中编译子模块源码，并打包签名辅助进程
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  MuleeSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MuleeSafariExtension
        excludes: [Info.plist]
      - path: Mulee/App/OpenURLRequest.swift
    entitlements:
      path: MuleeSafariExtension/MuleeSafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [LV69DG6R9Y.com.cqagc.mulee.video-login]
    dependencies:
      - package: MuleeCore
    info:
      path: MuleeSafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Mulee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    preBuildScripts:
      - name: Bundle Safari extension resources
        script: '"$SRCROOT"/scripts/package-extensions.sh --safari'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cqagc.mulee.safari-extension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  MuleeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MuleeTests
    dependencies:
      - target: Mulee
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cqagc.mulee.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mulee.app/Contents/MacOS/Mulee
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
schemes:
  Mulee:
    build:
      targets:
        Mulee: all
        MuleeTests: [test]
    test:
      targets:
        - MuleeTests

<!DOCTYPE html>
<html>
  <head>


    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <style>
          .b-root{--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink2:#6E6E73;--ink3:#A3A3A8;--accent:oklch(0.6 0.17 255);--track:rgba(0,0,0,.07);--wait:oklch(0.72 0.12 75);--ok:oklch(0.66 0.14 150);--field:#FFFFFF;
            width:420px;height:640px;position:relative;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;font-size:13px;color:var(--ink);background:repeating-linear-gradient(135deg,#E9E7E3 0 10px,#E3E1DC 10px 20px);overflow:hidden}
          .b-menubar{height:26px;background:rgba(246,245,243,.94);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
          .b-mi{width:14px;height:14px;border-radius:3px;background:rgba(0,0,0,.18)}
          .b-me{display:flex;align-items:center;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.1);font-variant-numeric:tabular-nums;font-size:9.5px;font-weight:600}
          .b-stack{display:flex;flex-direction:column;line-height:1.05}
          .b-pop{position:absolute;top:34px;right:58px;width:340px;background:rgba(250,250,249,.97);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 14px 40px rgba(0,0,0,.2);padding:14px;display:flex;flex-direction:column;gap:12px}
          .b-spd{display:flex;gap:18px;align-items:baseline}
          .b-big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
          .b-unit{font-size:12px;color:var(--ink2);font-weight:500;margin-left:3px}
          .b-hist{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;align-items:end;height:34px}
          .b-h{background:var(--accent);opacity:.55;border-radius:1.5px}
          .b-lbl{font-size:11px;font-weight:600;color:var(--ink3)}
          .b-t{display:flex;flex-direction:column;gap:4px}
          .b-tr{display:flex;gap:8px;font-size:12px}
          .b-tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .b-ts{color:var(--ink2);font-variant-numeric:tabular-nums}
          .b-track{height:3px;border-radius:2px;background:var(--track);overflow:hidden}
          .b-fill{height:100%;background:var(--accent);border-radius:2px}
          .b-fill.b-ok{background:var(--ok)}
          .b-waitline{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
          .b-wdot{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
          .b-field{height:30px;border-radius:8px;background:var(--field);border:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--ink3)}
          .b-sep{height:1px;background:var(--line)}
          .b-foot{display:flex;align-items:center;gap:8px;font-size:12px}
          .b-fb{height:26px;padding:0 10px;border-radius:6px;background:rgba(0,0,0,.05);display:flex;align-items:center;white-space:nowrap}
          .b-gdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
          .b-small{font-size:11px;color:var(--ink2)}
        </style>
      </helmet>
      <div class="b-root" data-screen-label="菜单栏面板">
        <div class="b-menubar">
          <span class="b-mi"></span>
          <span class="b-me"><span class="b-stack"><span>↓ 18.6M</span><span style="font-weight:500;opacity:.7">↑ 412K</span></span></span>
          <span class="b-mi"></span>
          <span class="b-mi"></span>
          <span>周四 11:24</span>
        </div>
        <div class="b-pop">
          <div class="b-spd">
            <div class="b-big">↓ 18.6<span class="b-unit">MB/s</span></div>
            <div class="b-big" style="font-size:16px;color:var(--ink2)">↑ 412<span class="b-unit">KB/s</span></div>
          </div>
          <div class="b-hist">
            <span class="b-h" style="height:30%"></span><span class="b-h" style="height:34%"></span><span class="b-h" style="height:40%"></span><span class="b-h" style="height:38%"></span><span class="b-h" style="height:52%"></span><span class="b-h" style="height:60%"></span><span class="b-h" style="height:58%"></span><span class="b-h" style="height:66%"></span><span class="b-h" style="height:70%"></span><span class="b-h" style="height:64%"></span><span class="b-h" style="height:72%"></span><span class="b-h" style="height:80%"></span><span class="b-h" style="height:76%"></span><span class="b-h" style="height:84%"></span><span class="b-h" style="height:90%"></span><span class="b-h" style="height:86%"></span><span class="b-h" style="height:78%"></span><span class="b-h" style="height:82%"></span><span class="b-h" style="height:88%"></span><span class="b-h" style="height:94%"></span><span class="b-h" style="height:100%"></span><span class="b-h" style="height:92%"></span><span class="b-h" style="height:86%"></span><span class="b-h" style="height:90%"></span><span class="b-h" style="height:84%"></span><span class="b-h" style="height:88%"></span><span class="b-h" style="height:92%"></span><span class="b-h" style="height:86%"></span><span class="b-h" style="height:90%"></span><span class="b-h" style="height:93%"></span>
          </div>
          <div class="b-lbl">正在下载 · 4</div>
          <div class="b-t">
            <div class="b-tr"><span class="b-tn">ubuntu-24.04.3-desktop-arm64.iso</span><span class="b-ts">11.2 MB/s</span></div>
            <div class="b-track"><div class="b-fill" style="width:62%"></div></div>
          </div>
          <div class="b-t">
            <div class="b-tr"><span class="b-tn">Big Buck Bunny 4K 合集</span><span class="b-ts">5.8 MB/s</span></div>
            <div class="b-track"><div class="b-fill" style="width:34%"></div></div>
          </div>
          <div class="b-t">
            <div class="b-tr"><span class="b-tn">城市夜景延时摄影【4K】</span><span class="b-ts">合并中</span></div>
            <div class="b-track"><div class="b-fill" style="width:96%"></div></div>
          </div>
          <div class="b-t">
            <div class="b-tr"><span class="b-tn">Sintel 原声与设定集.zip</span><span class="b-ts">解压中</span></div>
            <div class="b-track"><div class="b-fill b-ok" style="width:70%"></div></div>
          </div>
          <div class="b-waitline"><span class="b-wdot"></span>2 个电驴任务在等待来源，挂着就好</div>
          <div class="b-field">粘贴链接，回车直接下载</div>
          <div class="b-sep"></div>
          <div class="b-foot">
            <div class="b-fb">全部暂停</div>
            <div class="b-fb">打开 Mulee</div>
            <div class="fx ac gap4 b-small" style="margin-left:auto"><span class="b-gdot"></span>High ID</div>
          </div>
          <div class="b-small">下载时阻止睡眠 · 全部完成后允许睡眠</div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": { "width": 420, "height": 640 }
}'
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
